name: CI

on: [push, pull_request, workflow_dispatch]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  test-types:
    name: Test types with TS v${{ matrix.ts }} with Node.js ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        node-version: [22.x]
        os: [ubuntu-latest]
        ts: ['5.0', '5.1', '5.2', '5.3', '5.4', '5.5', '5.6', '5.7']
        test:
          [
            'test',
            'test-types',
            'test:bundler-esnext',
            'test:bundler-preserve',
            'test:node-10',
            'test:node-16',
            'test:node-next',
            'test:named-exports',
          ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install

      - name: Display folder structure
        run: ls -lah

      - name: Install TypeScript ${{ matrix.ts }}
        run: yarn add -D typescript@${{ matrix.ts }}

      - name: Show installed version of TypeScript
        run: |
          yarn info typescript
          yarn why typescript

      - name: Run ${{ matrix.test }}
        run: yarn run ${{ matrix.test }}

      - name: Did we fail?
        if: failure()
        run: ls -R
